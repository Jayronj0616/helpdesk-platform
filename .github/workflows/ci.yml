name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      # PageProps and LayoutProps are generated into .next/types, which is not committed, so generate them first.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners already have Google Chrome, which the tests drive (no browser download).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
